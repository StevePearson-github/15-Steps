name: Release

# Pushing a tag like v1.0.0 tests the game, builds the Mac, Windows and Android apps, and creates a DRAFT
# GitHub release with everything attached. Review the draft, then publish it by hand.
# "Run workflow" on a branch does a dry run: it builds everything but creates no release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Tag must match the version in package.json and Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          pkg=$(node -p "require('./package.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "tag=${GITHUB_REF_NAME} package.json=${pkg} Cargo.toml=${cargo}"
          [ "${GITHUB_REF_NAME}" = "v${pkg}" ] && [ "${pkg}" = "${cargo}" ]
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            name: mac
            args: --target universal-apple-darwin --bundles dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            name: windows
            args: --bundles nsis
            rust-targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run tauri -- build ${{ matrix.args }}

      - name: Collect Mac files
        if: matrix.name == 'mac'
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          mkdir out
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg "out/15-Steps-${v}-mac-universal.dmg"
      - name: Collect Windows files
        if: matrix.name == 'windows'
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          mkdir out
          # The installer, and the bare exe: the game is embedded in it, so it runs from anywhere with no install.
          cp src-tauri/target/release/bundle/nsis/*-setup.exe "out/15-Steps-${v}-windows-setup.exe"
          cp src-tauri/target/release/fifteen-steps.exe "out/15-Steps-${v}-windows-portable.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  android:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Android SDK and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Signing key (release tags only; a dry run builds an unsigned APK)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "Missing the ANDROID_KEYSTORE_BASE64 secret (see RELEASING.md)"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - run: npm run tauri -- android build --apk --target aarch64
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Collect Android file
        run: |
          v=$(node -p "require('./package.json').version")
          mkdir out
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
          [ -n "$apk" ] || { echo "No release APK found"; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
            cp "$apk" "out/15-Steps-${v}-android.apk"
          else
            cp "$apk" "out/15-Steps-${v}-android-UNSIGNED-dry-run.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Source archive (GitHub also adds its own automatic source zip/tarball)
        run: git archive --format=zip --prefix="15-steps-${GITHUB_REF_NAME#v}/" -o "artifacts/15-Steps-${GITHUB_REF_NAME#v}-source.zip" HEAD
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --draft --verify-tag --title "15 Steps ${GITHUB_REF_NAME#v}" --generate-notes
